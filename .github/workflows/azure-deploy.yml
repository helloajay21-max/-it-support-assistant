name: Build and Deploy to Azure App Service (Container)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  IMAGE_NAME: it-support-assistant

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image to Docker Hub
        env:
          DOCKER_BUILDKIT: 1
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          docker build -t $FULL_IMAGE .
          docker push $FULL_IMAGE
          echo "FULL_IMAGE=$FULL_IMAGE" >> $GITHUB_ENV

      - name: Configure web app to use new image
        run: |
          az webapp config container set \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --docker-custom-image-name ${{ env.FULL_IMAGE }} \
            --docker-registry-server-url https://index.docker.io \
            --docker-registry-server-user ${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-registry-server-password ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure core app settings
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --settings \
              OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              OPENAI_MODEL="gpt-4o-mini" \
              WEBSITES_PORT=8501 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              SQLITE_DB_PATH=/home/data/tickets.db \
              LOG_LEVEL=INFO \
              ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
              APP_BASE_URL="${{ secrets.APP_BASE_URL }}"

      - name: Configure admin auth settings (protected – skipped if ADMIN_PASSWORD secret is empty)
        env:
          _ADMIN_PASSWORD_CHECK: ${{ secrets.ADMIN_PASSWORD }}
        if: env._ADMIN_PASSWORD_CHECK != ''
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --settings \
              ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}"

      - name: Configure SMTP settings (protected – skipped if SMTP_HOST secret is empty)
        env:
          _SMTP_CHECK: ${{ secrets.SMTP_HOST }}
        if: env._SMTP_CHECK != ''
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --settings \
              SMTP_HOST="${{ secrets.SMTP_HOST }}" \
              SMTP_PORT="${{ secrets.SMTP_PORT }}" \
              SMTP_USERNAME="${{ secrets.SMTP_USERNAME }}" \
              SMTP_PASSWORD="${{ secrets.SMTP_PASSWORD }}" \
              SMTP_FROM_EMAIL="${{ secrets.SMTP_FROM_EMAIL }}" \
              SMTP_USE_TLS="${{ secrets.SMTP_USE_TLS }}" \
              SMTP_USE_SSL="${{ secrets.SMTP_USE_SSL }}" \
              VPN_RESET_BASE_URL="${{ secrets.VPN_RESET_BASE_URL }}"

      - name: Restart web app
        run: |
          az webapp restart \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }}

      - name: Get deployment URL
        run: |
          URL=$(az webapp show \
            --name ${{ secrets.WEBAPP_NAME }} \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --query defaultHostName -o tsv)
          echo ""
          echo "✅ Deployed to: https://$URL"
          echo "app_url=https://$URL" >> $GITHUB_STEP_SUMMARY

# ──────────────────────────────────────────────────────
# Required GitHub SECRETS (Settings → Secrets → Actions):
#   AZURE_CREDENTIALS   — az ad sp create-for-rbac --sdk-auth JSON
#   DOCKERHUB_USERNAME  — your Docker Hub username
#   DOCKERHUB_TOKEN     — Docker Hub access token
#   WEBAPP_NAME         — your-webapp-name
#   RESOURCE_GROUP      — your-resource-group
#   OPENAI_API_KEY      — sk-...
#   ADMIN_EMAIL         — admin notification inbox
#   ADMIN_PASSWORD      — admin login password for Ajay Kumar
#   SMTP_HOST           — smtp.gmail.com or your SMTP host
#   SMTP_PORT           — 587
#   SMTP_USERNAME       — SMTP login username
#   SMTP_PASSWORD       — SMTP app password / relay password
#   SMTP_FROM_EMAIL     — sender mailbox used by the app
#   SMTP_USE_TLS        — true (STARTTLS on port 587)
#   SMTP_USE_SSL        — false (set true for direct SSL on port 465)
#   VPN_RESET_BASE_URL  — https://selfservice.techcorp.com/reset-vpn
# ──────────────────────────────────────────────────────
