## Azure Container Apps configuration
## Deploy with: az containerapp up --source . --name it-support-assistant
## Or use the azure/deploy.sh script for full automated deployment.

# Minimum configuration for Azure Container Apps
properties:
  configuration:
    ingress:
      external: true
      targetPort: 8501
      transport: http
    registries: []
  template:
    containers:
      - name: it-support-assistant
        image: <ACR_NAME>.azurecr.io/it-support-assistant:latest
        resources:
          cpu: 1.0
          memory: 2.0Gi
        env:
          - name: AZURE_OPENAI_ENDPOINT
            secretRef: azure-openai-endpoint
          - name: AZURE_OPENAI_API_KEY
            secretRef: azure-openai-api-key
          - name: AZURE_OPENAI_DEPLOYMENT
            value: gpt-4o
          - name: AZURE_OPENAI_API_VERSION
            value: "2024-02-01"
          - name: LOG_LEVEL
            value: INFO
    scale:
      minReplicas: 1
      maxReplicas: 3
      rules:
        - name: http-scaling
          http:
            metadata:
              concurrentRequests: "10"
